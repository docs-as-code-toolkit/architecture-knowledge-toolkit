$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://architecture-knowledge-toolkit.example/metamodel/artifact.schema.yaml"
title: Architecture Artifact Metadata
description: >-
  Common YAML front matter metadata for reviewed architecture knowledge
  artifacts. The metadata is intentionally small and extensible; prose remains
  in the AsciiDoc body, while traceability is captured explicitly here.
type: object
additionalProperties: false
required:
  - id
  - type
  - title
  - status
  - owner
  - created
properties:
  id:
    type: string
    description: Stable architecture artifact identifier. IDs must not be reused.
    pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
    examples:
      - DOC-001-arc42
      - DOC-09000-architecture-decisions
      - DOC-09001-adr-index
  type:
    type: string
    description: Supported architecture artifact type.
    enum:
      - ADR
      - QualityScenario
      - Risk
      - Requirement
      - Constraint
      - Component
      - Interface
      - Stakeholder
      - Concept
      - Document
  title:
    type: string
    minLength: 1
  status:
    type: string
    description: >-
      Review axis: how confirmed the artifact is. Whether it still holds is the
      separate validity axis. 'superseded' and 'deprecated' are transitional
      exceptions that still carry temporal meaning here; ADR-009 defers their
      migration.
    enum:
      - draft
      - proposed
      - reviewed
      - accepted
      - rejected
      - superseded
      - deprecated
  validity:
    type: string
    description: >-
      Temporal axis: whether the artifact still holds. An absent value means
      active. The default below is a schema annotation and materializes
      nothing, so validator and generator implement that reading explicitly.
    enum:
      - active
      - retired
    default: active
  retired_on:
    type: string
    format: date
    description: >-
      Date of retirement. Required while validity is retired, rejected while
      the artifact is active, and never earlier than created.
  retired_reason:
    type: string
    description: >-
      Machine-readable retirement reason, for filtering and generated views.
      'no-longer-applicable' and 'removed' apply to every artifact type;
      'mitigated' and 'materialized' apply to Risk artifacts only, which the
      validator enforces.
    enum:
      - no-longer-applicable
      - removed
      - mitigated
      - materialized
  retired_note:
    type: string
    minLength: 1
    description: >-
      Free text explaining the retirement to a human reader. The reason is for
      machines, the note is for people; neither replaces the other. Omit it
      rather than leaving it empty.
  owner:
    type: string
    minLength: 1
  created:
    type: string
    format: date
  updated:
    type: string
    format: date
  reviewed:
    type: boolean
    description: True only after human review of the artifact content.
    default: false
  generated:
    type: boolean
    description: True when the file is derived output rather than source content.
    default: false
  summary:
    type: string
    description: Short human-readable summary for indexes and generated views.
  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
  source:
    type: string
    description: Optional repository-relative source path when metadata is stored separately.
  derived_from:
    type: array
    description: >-
      Optional origin notes for artifacts derived from a prompt, question,
      external document, repository document, or another artifact. Use this for
      provenance that explains why the artifact was created; use relations for
      architecture traceability between artifacts.
    items:
      oneOf:
        - type: string
          minLength: 1
        - type: object
          additionalProperties: false
          required:
            - description
          properties:
            type:
              type: string
              enum:
                - prompt
                - question
                - document
                - external
                - artifact
                - conversation
                - other
            description:
              type: string
              minLength: 1
            uri:
              type: string
              format: uri
            path:
              type: string
              description: Repository-relative source path.
            anchor:
              type: string
              description: Explicit AsciiDoc anchor for a source section or question.
              pattern: "^[a-z][a-z0-9-]*$"
            target:
              type: string
              description: Stable artifact ID when the origin is another architecture artifact.
              pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
  superseded_by:
    type: string
    description: Stable ID of the artifact that supersedes this one.
  relations:
    type: array
    description: Explicit outgoing relationships from this artifact.
    items:
      $ref: "relations.schema.yaml#/$defs/relation"
  metadata_version:
    type: string
    default: "1.0"
allOf:
  - if:
      properties:
        validity:
          const: retired
      required:
        - validity
    then:
      required:
        - retired_on
    else:
      properties:
        retired_on: false
        retired_reason: false
        retired_note: false

examples:
  - id: DOC-09001-adr-index
    type: Document
    title: ADR Index
    status: draft
    owner: project maintainers
    created: "2026-06-28"
    reviewed: false
    tags:
      - arc42
    relations:
      - type: refines
        target: DOC-09000-architecture-decisions
        status: proposed
        rationale: This detail page elaborates the corresponding arc42 chapter.
